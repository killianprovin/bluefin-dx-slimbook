name: Build and Push Custom Bluefin DX Image

on:
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 18 * * *"

  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      force_build:
        description: "Force rebuild even if base image unchanged"
        required: false
        default: false
        type: boolean

env:
  BASE_IMAGE: ghcr.io/ublue-os/bluefin-dx:stable
  IMAGE_NAME: bluefin-dx-slimbook
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  check:
    runs-on: ubuntu-latest

    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      bluefin_version: ${{ steps.bluefin.outputs.version }}
      bluefin_digest: ${{ steps.bluefin.outputs.digest }}
      slimbook_versions_hash: ${{ steps.slimbook.outputs.hash }}

    steps:
      - name: Get Bluefin version
        id: bluefin
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_INFO=$(skopeo inspect "docker://${BASE_IMAGE}")

          DIGEST=$(jq -r '.Digest' <<< "${IMAGE_INFO}")
          VERSION=$(jq -r '.Labels["org.opencontainers.image.version"]' <<< "${IMAGE_INFO}")

          test -n "${DIGEST}"
          test "${DIGEST}" != "null"
          test -n "${VERSION}"
          test "${VERSION}" != "null"

          echo "digest=${DIGEST}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

          echo "Bluefin DX version: ${VERSION}"
          echo "Bluefin DX digest:  ${DIGEST}"

      - name: Get Slimbook package versions
        id: slimbook
        shell: bash
        run: |
          set -euo pipefail

          FEDORA_VERSION=$(
            skopeo inspect "docker://${BASE_IMAGE}" \
              | jq -r '.Labels["ostree.linux"]' \
              | grep -oP 'fc\K[0-9]+'
          )

          test -n "${FEDORA_VERSION}"

          echo "Fedora version: ${FEDORA_VERSION}"

          PACKAGE_VERSIONS=$(
            podman run \
              --rm \
              --env FEDORA_VERSION="${FEDORA_VERSION}" \
              "fedora:${FEDORA_VERSION}" \
              bash -euo pipefail -c '
                PREV_FEDORA_VERSION=$((FEDORA_VERSION - 1))

                dnf config-manager addrepo \
                  --from-repofile="https://download.opensuse.org/repositories/home:/Slimbook/Fedora_${FEDORA_VERSION}/home:Slimbook.repo" \
                  2>/dev/null \
                || dnf config-manager addrepo \
                  --from-repofile="https://download.opensuse.org/repositories/home:/Slimbook/Fedora_${PREV_FEDORA_VERSION}/home:Slimbook.repo" \
                  2>/dev/null

                dnf repoquery \
                  --latest-limit=1 \
                  slimbook-meta-common \
                  slimbook-meta-executive \
                  slimbook-meta-gnome \
                  slimbook-service \
                  slimbook-qc71-kmod \
                  slimbook-qc71-kmod-common \
                  slimbook-yt6801-kmod \
                  slimbook-yt6801-kmod-common \
                  --qf "%{name}-%{version}-%{release}"
              '
          )

          test -n "${PACKAGE_VERSIONS}"

          echo "Slimbook packages:"
          echo "${PACKAGE_VERSIONS}"

          HASH=$(
            printf '%s\n' "${PACKAGE_VERSIONS}" \
              | sort \
              | sha256sum \
              | cut -d' ' -f1
          )

          echo "hash=${HASH}" >> "${GITHUB_OUTPUT}"
          echo "Slimbook packages hash: ${HASH}"

      - name: Check if rebuild is needed
        id: check
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" \
                && "${{ inputs.force_build }}" == "true" ]]; then
            echo "Force build requested"
            echo "should_build=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "Repository changed"
            echo "should_build=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "Checking current published image..."

          OUR_IMAGE="${IMAGE_REGISTRY}/${IMAGE_NAME}:latest"

          OUR_BASE_DIGEST=$(
            skopeo inspect "docker://${OUR_IMAGE}" 2>/dev/null \
              | jq -r '.Labels["org.opencontainers.image.base.digest"]' \
              || echo "not-found"
          )

          OUR_SLIMBOOK_HASH=$(
            skopeo inspect "docker://${OUR_IMAGE}" 2>/dev/null \
              | jq -r '.Labels["slimbook.packages.hash"]' \
              || echo "not-found"
          )

          UPSTREAM_BASE_DIGEST="${{ steps.bluefin.outputs.digest }}"
          CURRENT_SLIMBOOK_HASH="${{ steps.slimbook.outputs.hash }}"

          echo "Published base digest: ${OUR_BASE_DIGEST}"
          echo "Upstream base digest:  ${UPSTREAM_BASE_DIGEST}"
          echo "Published Slimbook:    ${OUR_SLIMBOOK_HASH}"
          echo "Current Slimbook:      ${CURRENT_SLIMBOOK_HASH}"

          if [[ "${OUR_BASE_DIGEST}" != "${UPSTREAM_BASE_DIGEST}" ]]; then
            echo "Bluefin base changed"
            echo "should_build=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [[ "${OUR_SLIMBOOK_HASH}" != "${CURRENT_SLIMBOOK_HASH}" ]]; then
            echo "Slimbook packages changed"
            echo "should_build=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "Nothing changed"
          echo "should_build=false" >> "${GITHUB_OUTPUT}"

  build:
    runs-on: ubuntu-latest
    needs:
      - check

    if: needs.check.outputs.should_build == 'true'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}

          tags: |
            type=raw,value=latest
            type=raw,value=stable
            type=raw,value=${{ needs.check.outputs.bluefin_version }}
            type=sha,prefix=

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          push: true

          tags: ${{ steps.meta.outputs.tags }}

          build-args: |
            SLIMBOOK_DIGEST=${{ needs.check.outputs.slimbook_versions_hash }}

          labels: |
            org.opencontainers.image.title=Bluefin DX Slimbook
            org.opencontainers.image.description=Custom Bluefin DX with Slimbook laptop support
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            io.artifacthub.package.readme-url=https://raw.githubusercontent.com/${{ github.repository }}/main/README.md
            org.opencontainers.image.base.name=${{ env.BASE_IMAGE }}
            org.opencontainers.image.base.digest=${{ needs.check.outputs.bluefin_digest }}
            slimbook.packages.hash=${{ needs.check.outputs.slimbook_versions_hash }}
